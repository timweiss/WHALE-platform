plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'androidx.room'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-parcelize'
    id 'kotlinx-serialization'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {

    compileSdk android_compile_version
    buildToolsVersion android_version

    defaultConfig {
        applicationId "de.mimuc.whale"
        minSdkVersion android_minSdkVersion
        targetSdkVersion android_targetSdkVersion
        versionCode 46
        versionName "1.0.46"

        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        buildConfigField 'boolean', 'IS_DEBUG', 'false'
        // set per build via -PenrolmentSource=<source>, see scripts/build-source-apks.sh
        buildConfigField 'String', 'AUTO_ENROLMENT_SOURCE',
                project.hasProperty('enrolmentSource') ? "\"${project.property('enrolmentSource')}\"" : 'null'
    }

    flavorDimensions = ["environment"]

    productFlavors {
        sisensing {
            dimension "environment"
            versionNameSuffix "-sisensing"
            buildConfigField 'String', 'API_BASE', '"https://sisensing.medien.ifi.lmu.de/"'
            buildConfigField 'String', 'AUTO_ENROLMENT', 'null'
        }
        staging {
            dimension "environment"
            versionNameSuffix "-staging"
            buildConfigField 'String', 'API_BASE', '"https://whale-staging.timweiss.dev/"'
            buildConfigField 'String', 'AUTO_ENROLMENT', '"test-nov6"'
        }
        stagingNoAutoEnrolment {
            dimension "environment"
            versionNameSuffix "-staging"
            buildConfigField 'String', 'API_BASE', '"https://whale-staging.timweiss.dev/"'
            buildConfigField 'String', 'AUTO_ENROLMENT', 'null'
        }
        prod {
            dimension "environment"
            buildConfigField 'String', 'API_BASE', '"https://api.whale.research.charlotte-fresenius-uni.de/"'
            buildConfigField 'String', 'AUTO_ENROLMENT', '"whale-studie"'
        }
        prodNoAutoEnrolment {
            dimension "environment"
            buildConfigField 'String', 'API_BASE', '"https://api.whale.research.charlotte-fresenius-uni.de/"'
            buildConfigField 'String', 'AUTO_ENROLMENT', 'null'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            buildConfigField 'boolean', 'IS_DEBUG', 'true'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    namespace 'de.mimuc.senseeverything'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.13'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    implementation group: 'com.squareup.okhttp3', name: 'okhttp', version: '4.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.gms:play-services-analytics:18.1.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation "com.google.code.gson:gson:$gson_library_version"
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.hilt:hilt-common:1.2.0'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    // the real org.json for JVM tests, android.jar only has stubs; test-only, not in the APK
    testImplementation 'org.json:json:20231013'

    def composeBom = platform('androidx.compose:compose-bom:2025.06.01')
    implementation(composeBom)
    androidTestImplementation(composeBom)

    // Choose one of the following:
    // Material Design 3
    implementation 'androidx.compose.material3:material3'

    // Android Studio Preview support
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // UI Tests
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Optional - Integration with activities
    implementation 'androidx.activity:activity-compose:1.10.1'
    // Optional - Integration with ViewModels
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.3'
    // Optional - Integration with LiveData
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation('androidx.lifecycle:lifecycle-runtime-compose:2.9.3')
    implementation 'androidx.lifecycle:lifecycle-service:2.9.3'


    // Room and Hilt run on KSP: under kapt they read Kotlin metadata themselves (max. 2.3) and reject
    // the stdlib 2.4 that LiteRT-LM brings.
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    ksp 'androidx.room:room-compiler:2.8.5'
    implementation 'com.android.volley:volley:1.2.1'

    implementation("androidx.datastore:datastore:1.1.7")

    def hilt_version = "2.58"
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-compiler:$hilt_version"
    ksp "androidx.hilt:hilt-compiler:1.2.0"
    implementation "androidx.hilt:hilt-work:1.2.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.6'
    implementation('com.github.gkonovalov.android-vad:yamnet:2.0.7') {
        // LiteRT (litert-api, via LiteRT-LM) is TensorFlow Lite's successor and contains the same
        // org.tensorflow.lite classes. YAMNet's Java side only needs DataType from them, whose API is
        // unchanged; its inference runs in the task library's own native code.
        exclude group: 'org.tensorflow', module: 'tensorflow-lite-api'
    }

    implementation "androidx.cardview:cardview:1.0.0"

    def work_version = "2.10.2"
    implementation "androidx.work:work-runtime-ktx:$work_version"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-core:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"

    // on-device content extraction (Gemma 4 E2B); the model file is downloaded, not bundled
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.20.0'

    // ML Kit Barcode Scanning (bundled - works immediately without downloads)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // CameraX for camera preview and image analysis
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
}

// The aggregating task builds Hilt's components in a separate javac run, which reads Kotlin metadata
// itself (max. 2.3) and fails on the stdlib 2.4 from LiteRT-LM. Without it the components are built in
// the KSP run; a single-module app loses nothing.
hilt {
    enableAggregatingTask = false
}

// exported schemas; Room's auto-migrations are generated from them
room {
    schemaDirectory "$projectDir/schemas"
}